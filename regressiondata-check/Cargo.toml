[package]
name = "regressiondata-check"
version.workspace = true
edition.workspace = true
description = "Cross-platform regression validation tool"
license.workspace = true

[[bin]]
name = "regressiondata-check"
path = "src/main.rs"

[dependencies]
sigmacatch-detection = { path = "../crates/sigmacatch-detection" }
sigmacatch-regression = { path = "../crates/sigmacatch-regression" }
sigmacatch-rule = { path = "../crates/sigmacatch-rule" }
sigmacatch-types = { path = "../crates/sigmacatch-types" }

input-windows-evtx = { path = "../crates/input-windows-evtx" }
linux-audit-parser = "0.2"

anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
