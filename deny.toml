# Cargo deny config — adapted from MalwareTracesGenerator

[advisories]
yanked = "warn"
# encoding v0.2.33 is unmaintained but required by evtx v0.12.2 (latest, no alternative)
ignore = ["RUSTSEC-2021-0153"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # LGPL-3.0: linux-audit-parser (auditd log parsing, based on Laurel's parser).
    # Statically linked into an MIT open-source binary — relinkability obligations
    # are satisfied by the availability of the project source.
    "LGPL-3.0",
    "LGPL-3.0-or-later",
]
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0 },
]

[sources]
allow-git = []
