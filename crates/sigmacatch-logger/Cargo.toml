[package]
name = "sigmacatch-logger"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Two-layer tracing subscriber: stderr info + daily rolling file debug"

[dependencies]
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

sigmacatch-config = { path = "../sigmacatch-config" }
