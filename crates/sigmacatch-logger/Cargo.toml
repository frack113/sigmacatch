[package]
name = "sigmacatch-logger"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Two-layer tracing subscriber: stderr info + daily rolling file debug"

[dependencies]
thiserror.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

sigmacatch-config = { path = "../sigmacatch-config" }

# Quality contract (quality.md Q2.1): inherit workspace lint tiers.
[lints]
workspace = true

[lib]
doctest = false
