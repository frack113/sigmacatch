[package]
name = "sigmacatch-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared sigmacatch pipeline runner (detection + regression generation loop)"

[dependencies]
sigmacatch-config = { path = "../sigmacatch-config" }
sigmacatch-detection = { path = "../sigmacatch-detection" }
sigmacatch-logger = { path = "../sigmacatch-logger" }
sigmacatch-regression = { path = "../sigmacatch-regression" }
sigmacatch-repo = { path = "../sigmacatch-repo" }
sigmacatch-rule = { path = "../sigmacatch-rule" }
sigmacatch-types = { path = "../sigmacatch-types" }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
anyhow = "1.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_EventLog",
    "Win32_System_Threading",
    "Win32_Security",
] }
