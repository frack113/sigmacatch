[package]
name = "sigmacatch-repo"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
grit-lib = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
chrono = "0.4"
tokio = { version = "1", features = ["rt"] }

sigmacatch-regression = { path = "../sigmacatch-regression" }

[dev-dependencies]
tempfile = "3.12"
