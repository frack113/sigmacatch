[package]
name = "sigmacatch-repo"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
grit-lib = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
chrono = "0.4"
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
crc32fast = "1.4"
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1.0"
rayon = "1.10"

[dev-dependencies]
tempfile = "3.12"
