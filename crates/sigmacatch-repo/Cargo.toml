[package]
name = "sigmacatch-repo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
grit-lib = "0.5"
input-evtx = { path = "../input-evtx" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
chrono = "0.4"
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
crc32fast = "1.5"
sha1 = "0.11"
sha2 = "0.11"
ssh-key = { version = "0.6", features = ["alloc", "ed25519"] }
flate2 = "1.1"
rayon = "1.12"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27"
