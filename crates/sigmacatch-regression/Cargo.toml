[package]
name = "sigmacatch-regression"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "yaml_serde", version = "0.10" }
thiserror.workspace = true
chrono = "0.4"
crc32fast = "1.5"
roxmltree = "0.21"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

sigmacatch-types = { path = "../sigmacatch-types" }
input-windows-evtx = { path = "../input-windows-evtx" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_EventLog",
] }

[dev-dependencies]
evtx = "0.12"
tempfile = "3.27"

# Quality contract: inherit workspace lint tiers ([workspace.lints] in root Cargo.toml).
[lints]
workspace = true

[lib]
doctest = false
