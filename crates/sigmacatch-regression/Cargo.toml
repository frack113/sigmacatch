[package]
name = "sigmacatch-regression"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "yaml_serde", version = "0.10" }
anyhow = "1.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

sigmacatch-types = { path = "../sigmacatch-types" }
sigmacatch-evtx-writer = { path = "../sigmacatch-evtx-writer" }
input-windows-evtx = { path = "../input-windows-evtx" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_EventLog",
] }

[dev-dependencies]
tempfile = "3.27"
