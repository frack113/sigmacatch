[package]
name = "input-linux-auditd"
version.workspace = true
edition.workspace = true
description = "Linux auditd log collector (tail /var/log/audit/audit.log)"
license.workspace = true

[dependencies]
sigmacatch-types = { path = "../sigmacatch-types" }

linux-audit-parser = "0.2"

async-trait = "0.1"
anyhow = "1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }