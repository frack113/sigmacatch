[package]
name = "input-winevt-channel"
version = "0.1.0"
edition = "2021"
description = "Live Winevt event collection from embedded channel mapping"
license = "MIT"

[dependencies]
sigmacatch-types = { path = "../sigmacatch-types" }
anyhow = "1.0"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "sync"] }
phf = { version = "0.14", features = ["macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_EventLog",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
serde_json = "1.0"
