[package]
name = "sigmacatch-rule"
version = "0.1.0"
edition = "2021"
description = "Sigma rule management: loading, filtering, scanning, and AST indexing"
license = "MIT"

[dependencies]
anyhow = "1.0"
rsigma-parser = "0.20"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
sigmacatch-types = { path = "../sigmacatch-types" }

[target.'cfg(not(unix))'.dependencies]
dunce = "1.0"

[dev-dependencies]
tempfile = "3"
