[package]
name = "sigmacatch-rule"
version.workspace = true
edition.workspace = true
description = "Sigma rule management: loading, filtering, scanning, and AST indexing"
license.workspace = true

[dependencies]
anyhow = "1.0"
rsigma-parser = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10" }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(unix))'.dependencies]
dunce = "1.0"

[dev-dependencies]
tempfile = "3"
serde_yaml = { package = "yaml_serde", version = "0.10" }

# Quality contract (quality.md Q2.1): inherit workspace lint tiers.
[lints]
workspace = true

[lib]
doctest = false
