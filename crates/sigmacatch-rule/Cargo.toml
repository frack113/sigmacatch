[package]
name = "sigmacatch-rule"
version = "0.2.0"
edition = "2021"
description = "Sigma rule management: loading, filtering, scanning, and AST indexing"
license = "MIT"

[dependencies]
anyhow = "1.0"
phf = { version = "0.14", features = ["macros"] }
rsigma-parser = "0.20"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"

[target.'cfg(not(unix))'.dependencies]
dunce = "1.0"

[dev-dependencies]
tempfile = "3"
serde_yaml = { package = "yaml_serde", version = "0.10" }
