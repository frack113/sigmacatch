[package]
name = "sigmacatch-evtx-writer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal pure-Rust EVTX writer (single-record, direct BinXML) for ETW regression data"

[dependencies]
thiserror.workspace = true
chrono = "0.4"
crc32fast = "1.5"
roxmltree = "0.21"

[dev-dependencies]
evtx = "0.12"
input-windows-evtx = { path = "../input-windows-evtx" }
tempfile = "3.27"

# Quality contract (quality.md Q2.1): inherit workspace lint tiers.
[lints]
workspace = true

[lib]
doctest = false
