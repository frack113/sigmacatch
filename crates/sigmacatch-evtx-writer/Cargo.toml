[package]
name = "sigmacatch-evtx-writer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal pure-Rust EVTX writer (single-record, direct BinXML) for ETW regression data"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
crc32fast = "1.4"
roxmltree = "0.21"

[dev-dependencies]
evtx = "0.12"
input-windows-evtx = { path = "../input-windows-evtx" }
tempfile = "3"
