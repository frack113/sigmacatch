[package]
name = "input-windows-evtx"
version.workspace = true
edition.workspace = true
description = "Parse EVTX files into sigmacatch_types::Event objects"
license.workspace = true

[dependencies]
anyhow = "1.0"  # EventProducer trait (sigmacatch-types) requires it
thiserror.workspace = true
async-trait = "0.1"
evtx = "0.12"
sigmacatch-types = { path = "../sigmacatch-types" }
tokio = { version = "1", features = ["sync"] }

# Quality contract (quality.md Q2.1): inherit workspace lint tiers.
[lints]
workspace = true

[lib]
doctest = false
