[package]
name = "input-windows-evtx"
version.workspace = true
edition.workspace = true
description = "Parse EVTX files into sigmacatch_types::Event objects"
license.workspace = true

[dependencies]
thiserror.workspace = true
async-trait = "0.1"
evtx = "0.12"
sigmacatch-types = { path = "../sigmacatch-types" }
tokio = { version = "1", features = ["sync"] }

# Quality contract: inherit workspace lint tiers ([workspace.lints] in root Cargo.toml).
[lints]
workspace = true

[lib]
doctest = false
