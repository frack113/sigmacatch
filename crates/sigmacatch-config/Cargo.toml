[package]
name = "sigmacatch-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Application configuration: Config, GitConfig, SigmaFilterConfig, LogConfig"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10" }
anyhow = "1.0"
tracing = "0.1"

sigmacatch-repo = { path = "../sigmacatch-repo" }
sigmacatch-rule = { path = "../sigmacatch-rule" }
sigmacatch-types = { path = "../sigmacatch-types" }

[dev-dependencies]
tempfile = "3.27"

# Quality contract (quality.md Q2.1): inherit workspace lint tiers.
[lints]
workspace = true
