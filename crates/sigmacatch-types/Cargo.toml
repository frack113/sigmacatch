[package]
name = "sigmacatch-types"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared types (Event, Alert) for all sigmacatch crates and binaries"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "0.21"
tokio = { version = "1", features = ["rt", "sync"] }
async-trait = "0.1"
