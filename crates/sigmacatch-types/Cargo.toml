[package]
name = "sigmacatch-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types (Event, Alert) for all sigmacatch crates and binaries"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "0.21"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }
async-trait = "0.1"
phf = { version = "0.14", features = ["macros"] }
uuid = { version = "1", features = ["v4"] }

# Quality contract (quality.md Q2.1): inherit workspace lint tiers.
[lints]
workspace = true

[lib]
doctest = false
