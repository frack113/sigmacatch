[package]
name = "sigmacatch-check"
version.workspace = true
edition.workspace = true
description = "Cross-platform regression validation tool"
license.workspace = true

[[bin]]
name = "sigmacatch-check"
path = "src/main.rs"

[dependencies]
sigmacatch-detection = { path = "../sigmacatch-detection" }
sigmacatch-regression = { path = "../sigmacatch-regression" }
sigmacatch-rule = { path = "../sigmacatch-rule" }
sigmacatch-types = { path = "../sigmacatch-types" }

input-windows-evtx = { path = "../input-windows-evtx" }
linux-audit-parser = "0.2"

anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"

# Quality contract (quality.md Q2.1): inherit workspace lint tiers.
[lints]
workspace = true
