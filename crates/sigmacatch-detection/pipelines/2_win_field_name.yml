  # ─── Firewall-AS-specific field name mapping ───
  # Microsoft-Windows-Windows Firewall With Advanced Security/Firewall channel
  # EventData keys: ModifyingApplication, ApplicationPath, Action
  - id: firewall_as_fields
    type: field_name_mapping
    mapping:
      ModifyingApplication: Event.EventData.ModifyingApplication
      ApplicationPath: Event.EventData.ApplicationPath
      Action: Event.EventData.Action
    rule_conditions:
      - type: logsource
        service: firewall-as
        product: windows

  # ─── WinDefend-specific field name mapping ───
  # WinDefend EventData keys have spaces (e.g. "Source Name", "Product Name").
  # handle_event_data strips spaces → "SourceName", "ProductName", etc.
  # Sigma rules use the same names — map them to Event.EventData.*
  - id: windefend_eventdata_fields
    type: field_name_mapping
    mapping:
      SourceName: Event.EventData.SourceName
      ProductName: Event.EventData.ProductName
      ProductVersion: Event.EventData.ProductVersion
      DetectionID: Event.EventData.DetectionID
      DetectionTime: Event.EventData.DetectionTime
      ThreatID: Event.EventData.ThreatID
      ThreatName: Event.EventData.ThreatName
      SeverityID: Event.EventData.SeverityID
      SeverityName: Event.EventData.SeverityName
      CategoryID: Event.EventData.CategoryID
      CategoryName: Event.EventData.CategoryName
      StatusCode: Event.EventData.StatusCode
      StatusDescription: Event.EventData.StatusDescription
      SourceID: Event.EventData.SourceID
      ProcessName: Event.EventData.ProcessName
      Path: Event.EventData.Path
      DetectionUser: Event.EventData.DetectionUser
      OriginID: Event.EventData.OriginID
      OriginName: Event.EventData.OriginName
      ExecutionID: Event.EventData.ExecutionID
      ExecutionName: Event.EventData.ExecutionName
      TypeID: Event.EventData.TypeID
      TypeName: Event.EventData.TypeName
      PreExecutionStatus: Event.EventData.PreExecutionStatus
      ActionID: Event.EventData.ActionID
      ActionName: Event.EventData.ActionName
      ErrorCode: Event.EventData.ErrorCode
      ErrorDescription: Event.EventData.ErrorDescription
      PostCleanStatus: Event.EventData.PostCleanStatus
      AdditionalActionsID: Event.EventData.AdditionalActionsID
      AdditionalActionsString: Event.EventData.AdditionalActionsString
      RemediationUser: Event.EventData.RemediationUser
      SecurityIntelligenceVersion: Event.EventData.SecurityIntelligenceVersion
      EngineVersion: Event.EventData.EngineVersion
    rule_conditions:
      - type: logsource
        service: windefend
        product: windows

  # ─── WMI-Activity-specific field name mapping ───
  # WMI-Activity/Operational EID 5858 (ClientFailure) uses UserData.Operation_ClientFailure
  # instead of EventData. Map Operation to the correct nested path.
  - id: wmi_activity_fields
    type: field_name_mapping
    mapping:
      Operation: Event.UserData.Operation_ClientFailure.Operation
    rule_conditions:
      - type: logsource
        service: wmi
        product: windows
