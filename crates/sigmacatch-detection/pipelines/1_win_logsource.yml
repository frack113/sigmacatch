        product: windows
  - id: win_route_process_access
    type: change_logsource
    service: sysmon
    rule_conditions:
      - type: logsource
        category: process_access
        product: windows
  - id: win_route_file_event
    type: change_logsource
    service: sysmon
    rule_conditions:
      - type: logsource
        category: file_event
        product: windows
  - id: win_route_registry_add
    type: change_logsource
    service: sysmon
    rule_conditions:
      - type: logsource
        category: registry_add
        product: windows
  - id: win_route_registry_delete
    type: change_logsource
    service: sysmon
    rule_conditions:
