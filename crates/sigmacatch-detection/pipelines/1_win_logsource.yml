# Check with sysmon for windows v15.21, schema 4.91
name: windows
priority: 1

transformations:
  # EventID 1: process_creation
  - id: win_process_creation
    type: add_condition
    conditions:
      Event.System.EventID: 1
    rule_conditions:
      - type: logsource
        category: process_creation
        product: windows

  # EventID 2: file_change
  - id: win_file_change
    type: add_condition
    conditions:
      Event.System.EventID: 2
    rule_conditions:
      - type: logsource
        category: file_change
        product: windows

  # EventID 3: network_connection
  - id: win_network_connection
    type: add_condition
    conditions:
      Event.System.EventID: 3
    rule_conditions:
      - type: logsource
        category: network_connection
        product: windows

  # EventID 5: process_termination
  - id: win_process_termination
    type: add_condition
    conditions:
      Event.System.EventID: 5
    rule_conditions:
      - type: logsource
        category: process_termination
        product: windows

  # EventID 6: driver_load
  - id: win_driver_load
    type: add_condition
    conditions:
      Event.System.EventID: 6
    rule_conditions:
      - type: logsource
        category: driver_load
        product: windows

  # EventID 7: image_load
  - id: win_image_load
    type: add_condition
    conditions:
      Event.System.EventID: 7
    rule_conditions:
      - type: logsource
        category: image_load
        product: windows

  # EventID 8: create_remote_thread
  - id: win_create_remote_thread
    type: add_condition
    conditions:
      Event.System.EventID: 8
    rule_conditions:
      - type: logsource
        category: create_remote_thread
        product: windows

  # EventID 9: raw_access_thread
  - id: win_raw_access_thread
    type: add_condition
    conditions:
      Event.System.EventID: 9
    rule_conditions:
      - type: logsource
        category: raw_access_thread
        product: windows

  # EventID 10: process_access
  - id: win_process_access
    type: add_condition
    conditions:
      Event.System.EventID: 10
    rule_conditions:
      - type: logsource
        category: process_access
        product: windows

  # EventID 11: file_event
  - id: win_file_event
    type: add_condition
    conditions:
      Event.System.EventID: 11
    rule_conditions:
      - type: logsource
        category: file_event
        product: windows

  # EventID 12: registry_add (sub-category of registry_event)
  - id: win_registry_add
    type: add_condition
    conditions:
      Event.System.EventID: 12
      Event.EventData.EventType: CreateKey
    rule_conditions:
      - type: logsource
        category: registry_add
        product: windows

  # EventID 12: registry_delete (sub-category of registry_event)
  # No EventType filter: Sysmon EventID 12 uses both DeleteKey and DeleteValue pb rsigma >0.20.0
  - id: win_registry_delete
    type: add_condition
    conditions:
      Event.System.EventID: 12
    rule_conditions:
      - type: logsource
        category: registry_delete
        product: windows

  # EventID 13: registry_set (sub-category of registry_event)
  - id: win_registry_set
    type: add_condition
    conditions:
      Event.System.EventID: 13
      Event.EventData.EventType: SetValue
    rule_conditions:
      - type: logsource
        category: registry_set
        product: windows

  # EventID 14: registry_rename (sub-category of registry_event)
  - id: win_registry_rename
    type: add_condition
    conditions:
      Event.System.EventID: 14
      Event.EventData.EventType: RenameKey
    rule_conditions:
      - type: logsource
        category: registry_rename
        product: windows

  # EventID 15: create_stream_hash
  - id: win_create_stream_hash
    type: add_condition
    conditions:
      Event.System.EventID: 15
    rule_conditions:
      - type: logsource
        category: create_stream_hash
        product: windows


  # EventID 19/20/21: wmi_event
  - id: win_wmi_event
    type: add_condition
    conditions:
      Event.System.EventID: [19, 20, 21]
    rule_conditions:
      - type: logsource
        category: wmi_event
        product: windows

  # EventID 22: dns_query
  - id: win_dns_query
    type: add_condition
    conditions:
      Event.System.EventID: 22
    rule_conditions:
      - type: logsource
        category: dns_query
        product: windows

  # EventID 23: file_delete
  - id: win_file_delete
    type: add_condition
    conditions:
      Event.System.EventID: 23
    rule_conditions:
      - type: logsource
        category: file_delete
        product: windows

  # EventID 24: clipboard_capture
  - id: win_clipboard_capture
    type: add_condition
    conditions:
      Event.System.EventID: 24
    rule_conditions:
      - type: logsource
        category: clipboard_capture
        product: windows

  # EventID 25: process_tampering
  - id: win_process_tampering
    type: add_condition
    conditions:
      Event.System.EventID: 25
    rule_conditions:
      - type: logsource
        category: process_tampering
        product: windows

  # EventID 26: file_delete_detected
  - id: win_file_delete_detected
    type: add_condition
    conditions:
      Event.System.EventID: 26
    rule_conditions:
      - type: logsource
        category: file_delete_detected
        product: windows

  # EventID 27: file_block_executable
  - id: win_file_block_executable
    type: add_condition
    conditions:
      Event.System.EventID: 27
    rule_conditions:
      - type: logsource
        category: file_block_executable
        product: windows

  # EventID 28: file_block_shredding
  - id: win_file_block_shredding
    type: add_condition
    conditions:
      Event.System.EventID: 28
    rule_conditions:
      - type: logsource
        category: file_block_shredding
        product: windows

  # EventID 29: file_executable_detected
  - id: win_file_executable_detected
    type: add_condition
    conditions:
      Event.System.EventID: 29
    rule_conditions:
      - type: logsource
        category: file_executable_detected
        product: windows


  # EventID 255: sysmon_error
  - id: win_sysmon_error
    type: add_condition
    conditions:
      Event.System.EventID: 255
    rule_conditions:
      - type: logsource
        category: sysmon_error
        product: windows

  # EventID 12/13/14: registry_event (parent category — any registry op)
  - id: win_registry_event
    type: add_condition
    conditions:
      Event.System.EventID: [12, 13, 14]
    rule_conditions:
      - type: logsource
        category: registry_event
        product: windows

  # EventID 4/16: sysmon_status (system status events)
  - id: win_sysmon_status
    type: add_condition
    conditions:
      Event.System.EventID: [4, 16]
    rule_conditions:
      - type: logsource
        category: sysmon_status
        product: windows

  # EventID 17/18: pipe_created (OR — each event has exactly one EID)
  - id: win_pipe_created
    type: add_condition
    conditions:
      Event.System.EventID: [17, 18]
    rule_conditions:
      - type: logsource
        category: pipe_created
        product: windows

  # Rewrite the logsource service for every category routed above so embedders
  # derive the Windows event channel from the post-pipeline logsource (#437)
  # instead of duplicating the category → service mapping in the resolver.
  # Each block uses the same logsource gate as its matching add_condition above.
  - id: win_route_process_creation
    type: change_logsource
    service: sysmon
    rule_conditions:
      - type: logsource
        category: process_creation
        product: windows
  - id: win_route_file_change
    type: change_logsource
    service: sysmon
