[package]
name = "sigmacatch-detection"
version.workspace = true
edition.workspace = true
description = "Thin wrapper around rsigma-eval for loading pipelines and rules, then evaluating events"
license.workspace = true

[dependencies]
anyhow = "1.0"
phf = { version = "0.14", features = ["macros"] }
rsigma-eval = "0.21"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
sigmacatch-types = { path = "../sigmacatch-types" }
sigmacatch-rule = { path = "../sigmacatch-rule" }

[dev-dependencies]
tempfile = "3"

# Quality contract (quality.md Q2.1): inherit workspace lint tiers.
[lints]
workspace = true

[lib]
doctest = false
