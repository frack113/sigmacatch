[package]
name = "sigmacatch-detection"
version.workspace = true
edition.workspace = true
description = "Thin wrapper around rsigma-eval for loading pipelines and rules, then evaluating events"
license.workspace = true

[dependencies]
rsigma-eval = { version = "0.21", features = ["daachorse-index"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror.workspace = true
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
sigmacatch-types = { path = "../sigmacatch-types" }
sigmacatch-rule = { path = "../sigmacatch-rule" }

[dev-dependencies]
tempfile = "3.27"

# Quality contract: inherit workspace lint tiers ([workspace.lints] in root Cargo.toml).
[lints]
workspace = true

[lib]
doctest = false
