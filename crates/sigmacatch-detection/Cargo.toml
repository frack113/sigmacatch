[package]
name = "sigmacatch-detection"
version = "0.1.0"
edition = "2021"
description = "Thin wrapper around rsigma-eval for loading pipelines and rules, then evaluating events"
license = "MIT"

[dependencies]
anyhow = "1.0"
rsigma-eval = "0.21"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
sigmacatch-types = { path = "../sigmacatch-types" }
sigmacatch-rule = { path = "../sigmacatch-rule" }

[dev-dependencies]
tempfile = "3"
