[package]
name = "input-windows-channels"
version = "0.1.0"
edition = "2021"
description = "Multi-channel Windows Event Log collector with internal FIFO"
license = "MIT"

[dependencies]
sigmacatch-types = { path = "../sigmacatch-types" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_EventLog",
    "Win32_System_Threading",
    "Win32_Security",
] }
