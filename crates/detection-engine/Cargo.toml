[package]
name = "detection-engine"
version = "0.1.0"
edition = "2021"
description = "Thin wrapper around rsigma-eval for loading pipelines and rules, then evaluating events"
license = "MIT"

[dependencies]
anyhow = "1.0"
rsigma-eval = "0.20"
rsigma-parser = "0.20"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
sigmacatch-types = { path = "../sigmacatch-types" }
input-windows-channels = { path = "../input-windows-channels" }
tokio = { version = "1", features = ["full"] }

[target.'cfg(not(unix))'.dependencies]
dunce = "1.0"

[dev-dependencies]
tempfile = "3"
