# SPDX-FileCopyrightText: 2026 sigmacatch contributors

[workspace]
resolver = "2"
members = [
    "sigmacatch-win",
    "sigmacatch-lnx",
    "crates/sigmacatch-runner",
    "crates/sigmacatch-regression",
    "crates/sigmacatch-detection",
    "crates/sigmacatch-types",
    "crates/sigmacatch-config",
    "crates/sigmacatch-logger",
    "crates/input-windows-evtx",
    "crates/sigmacatch-evtx-writer",
    "crates/sigmacatch-rule",
    "crates/sigmacatch-repo",
    "crates/sigmacatch-ebpf-common",
    "sigmacatch-check",
]

# Nightly-only bpf-el crate: built separately (see crates/sigmacatch-ebpf/Cargo.toml
# and sigmacatch-lnx/build.rs), never as part of the stable workspace graph.
exclude = [
    "crates/sigmacatch-ebpf",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"

# Quality contract (quality.md Q2.2): explicit tiers, single source of truth.
# Pedantic/nursery groups stay OUT — cherry-pick individual lints only, each
# ratcheted to zero before being added here (ratchet protocol Q2.3).
[workspace.dependencies]
thiserror = "2"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
style = "warn"
complexity = "warn"
perf = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
