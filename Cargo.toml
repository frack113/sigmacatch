# SPDX-License-Identifier: MIT
# SPDX-FileCopyrightText: 2026 sigmacatch contributors

[workspace]
resolver = "2"
members = [
  "sigmacatch",
  "common/core",
  "sigmacatch/repo",
  "sigmacatch/sigma-regression",
  "sigmacatch/inputs/ebpf",
  "sigmacatch/inputs/tail",
  "sigmacatch/inputs/etw-common",
  "sigmacatch/inputs/auditd",
  "sigmacatch/inputs/syslog",
  "sigmacatch/inputs/sysmon",
  "sigmacatch/inputs/winevt",
  "sigmacatch/inputs/evtx",
  "sigmacatch/inputs/macos",
  "sigmacatch/inputs/etw",
  "sigmacatch/inputs/etw-driver",
  # Shared with the standalone driver workspace by path dependency.
  "sigmacatch/driver/protocol",
  "sigmacatch/outputs/evtx",
  "sigmacatch/outputs/regression",
]

# The ebpf probe (sigmacatch/ebpf) is excluded: built separately by build.rs.
[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"

# Cherry-pick individual lints only; each ratcheted to zero before adding.
[workspace.dependencies]
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
style = "warn"
complexity = "warn"
perf = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
