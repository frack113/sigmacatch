[workspace]
resolver = "2"
members = [
    "sigmacatch",
    "crates/sigmacatch-regression",
    "crates/sigmacatch-detection",
    "crates/sigmacatch-types",
    "crates/sigmacatch-config",
    "crates/sigmacatch-logger",
    "crates/input-evtx",
    "crates/input-windows-channels",
    "crates/input-windows-etw",
    "crates/sigmacatch-evtx-writer",
    "crates/sigmacatch-rule",
    "crates/sigmacatch-repo",
    "tools",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[profile.release]
strip = true
lto = true
codegen-units = 1
