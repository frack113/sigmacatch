[workspace]
resolver = "2"
members = [
  "sigmacatch",
  "common/core",
  "detection",
  "runner",
  "common/repo",
  "common/sigma-regression",
  "collector/ebpf",
  "collector/tail",
  "collector/etw-common",
  "collector/auditd",
  "collector/syslog",
  "collector/sysmon",
  "collector/winevt",
  "collector/evtx",
  "collector/macos",
  "collector/etw",
  "collector/etw-driver",
  # Shared with the standalone driver workspace by path dependency.
  "sensor/windows/protocol",
  "persist/evtx",
  "persist/regression",
]

# The ebpf probe (sensor/ebpf) is excluded: built separately by build.rs.
[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT"

# Cherry-pick individual lints only; each ratcheted to zero before adding.
[workspace.dependencies]
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
style = "warn"
complexity = "warn"
perf = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
