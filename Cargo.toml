# SPDX-FileCopyrightText: 2026 sigmacatch contributors

[workspace]
resolver = "2"
members = [
    "sigmacatch",
    "crates/sigmacatch-ebpf-common",
]

# Nightly-only bpf-el crate: built separately (see crates/sigmacatch-ebpf/Cargo.toml
# and sigmacatch/build.rs), never as part of the stable workspace graph.
exclude = [
    "crates/sigmacatch-ebpf",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"

# Quality contract: explicit lint tiers, single source of truth ([workspace.lints]).
# Pedantic/nursery groups stay OUT — cherry-pick individual lints only, each
# ratcheted to zero before being added here (ratchet protocol Q2.3).
[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
style = "warn"
complexity = "warn"
perf = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
