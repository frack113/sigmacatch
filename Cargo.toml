# SPDX-FileCopyrightText: 2026 sigmacatch contributors

[workspace]
resolver = "2"
members = [
  "sigmacatch",
  "sigmacatch/core",
  "sigmacatch/inputs/ebpf",
  "sigmacatch/inputs/tail",
]

# The ebpf probe (sigmacatch/ebpf) is excluded: built separately by build.rs.
[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"

# Cherry-pick individual lints only; each ratcheted to zero before adding.
[workspace.dependencies]
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
style = "warn"
complexity = "warn"
perf = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
