# SPDX-FileCopyrightText: 2026 sigmacatch contributors

site_name: Sigmacatch
site_description: Headless tool that captures real OS events (Windows Event Log, EVTX files, Linux auditd, syslog, Sysmon and eBPF) and matches them against SigmaHQ rules
repo_url: https://github.com/frack113/sigmacatch
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User:
    - CLI: user/cli.md
    - Diagnostics: user/diagnostics.md
    - regressiondata-check: user/regressiondata-check.md
    - Configuration: user/config.md
    - Troubleshooting:
      - Overview: user/troubleshooting.md
      - Run and git: user/troubleshooting/run.md
      - Windows: user/troubleshooting/windows.md
      - Linux: user/troubleshooting/linux.md
  - Regression Data:
    - Overview: regression_data/index.md
    - info.yml: regression_data/info-yml.md
    - Data Files: regression_data/data-files.md
    - Validation: regression_data/validation.md
  - Dev:
    - Architecture: dev/architecture.md
    - Layout: dev/layout.md
    - Collectors:
      - Overview: dev/collectors/index.md
      - Windows: dev/collectors/windows.md
      - Linux: dev/collectors/linux.md
      - EVTX: dev/collectors/evtx.md
    - Windows without Sysmon: dev/etw-collector.md
    - Sysmon vs sigmacatch: dev/sysmon-vs-sigmacatch.md
    - Pipeline: dev/pipeline.md
    - Design Notes: dev/design-notes.md
    - Build: dev/build.md
    - Windows dev VM: dev/windows-vm.md
    - SigmaHQ Workflow: dev/git.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

validation:
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: info
