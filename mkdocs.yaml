site_name: Sigmacatch
site_description: Headless tool that captures real OS events (Windows Event Log, EVTX files, Linux auditd, syslog, Sysmon and eBPF) and matches them against SigmaHQ rules
repo_url: https://github.com/frack113/sigmacatch
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User:
    - CLI: user/cli.md
    - Configuration: user/config.md
    - Troubleshooting: user/troubleshooting.md
  - Regression Data:
    - Overview: regression_data/index.md
    - info.yml: regression_data/info-yml.md
    - Data Files: regression_data/data-files.md
    - Validation: regression_data/validation.md
  - Dev:
    - Architecture: dev/architecture.md
    - Collectors: dev/collectors.md
    - Pipeline: dev/pipeline.md
    - Design Notes: dev/design-notes.md
    - Build: dev/build.md
    - SigmaHQ Workflow: dev/git.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

validation:
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: info
