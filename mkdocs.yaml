site_name: Sigmacatch
site_description: Headless tool that captures real Windows events via Winevt API and matches them against SigmaHQ rules
repo_url: https://github.com/frack113/sigmacatch
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - User:
    - CLI: user/cli.md
    - Configuration: user/config.md
    - SigmaHQ Workflow: user/git.md
    - Regression Data: user/regression-data.md
  - Dev:
    - Architecture: dev/architecture.md
    - Build: dev/build.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

validation:
  links:
    not_found: info
    absolute_links: info
    unrecognized_links: info
