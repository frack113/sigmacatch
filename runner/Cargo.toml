[package]
name = "sigmacatch-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "sigmacatch runner: orchestrates collectors, detection engine, and output sinks"
license.workspace = true

[lib]
doctest = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Console",
] }

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
sigmacatch-core = { path = "../common/core" }
sigmacatch-detection = { path = "../detection" }
tokio = { version = "1.54.1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "signal",
  "fs",
  "io-util",
  "process",
] }
tracing.workspace = true
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3.27.0"

[lints]
workspace = true
