[package]
name = "sigmacatch-input-etw-driver"
version.workspace = true
edition.workspace = true
description = "sigmacatch Windows kernel-sensor client"
license.workspace = true

[lib]
doctest = false

# The kernel device and its Win32 IOCTLs are Windows-only. The wire format
# comes from `sigmacatch-driver-protocol`, shared with the WDK driver crate.
[target.'cfg(target_os = "windows")'.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
sha1 = "0.11.0"
sigmacatch-core = { path = "../../common/core" }
sigmacatch-driver-protocol = { path = "../../sigmacatch/driver/protocol" }
sigmacatch-input-etw-common = { path = "../etw-common" }
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tracing.workspace = true
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[lints]
workspace = true
