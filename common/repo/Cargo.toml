[package]
name = "sigmacatch-repo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "sigmacatch SigmaHQ repository layer: clone, branch, commit, transport"
license.workspace = true

[lib]
doctest = false

[dependencies]
chrono = "0.4.45"
crc32fast = "1.5.6"
flate2 = "1.1.11"
grit-lib = "0.5.33"
rayon = "1.12.0"
sha1 = "0.11.0"
sha2 = "0.11.2"
sigma-regression = { path = "../sigma-regression" }
# `getrandom` enables `ssh_key::rand_core::OsRng`; the test helpers take their
# RNG from that re-export rather than pinning a rand_core line of their own.
ssh-key = { version = "0.6.7", features = ["alloc", "ed25519", "getrandom"] }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt", "time"] }
tracing.workspace = true
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
anyhow = "1.0.105"
tempfile = "3.27.0"

[lints]
workspace = true
