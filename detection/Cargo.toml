[package]
name = "sigmacatch-detection"
version.workspace = true
edition.workspace = true
description = "sigmacatch Sigma detection engine"
license.workspace = true

[lib]
doctest = false

[dependencies]
rayon = "1.12.0"
rsigma-eval = { version = "0.27.0", features = ["daachorse-index", "parallel"] }
rsigma-parser = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sigmacatch-core = { path = "../common/core" }
thiserror.workspace = true
tracing.workspace = true
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
