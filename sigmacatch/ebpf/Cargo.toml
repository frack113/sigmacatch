# SPDX-FileCopyrightText: 2026 sigmacatch contributors
#
# Nightly-only bpf-el probe crate, excluded from the workspace. Built by
# sigmacatch/src/build.rs; the wire-format types come from
# sigmacatch/src/ebpf_common.rs via #[path].

[workspace]

[package]
name = "sigmacatch-ebpf"
version = "0.1.0"
edition = "2021"
description = "sigmacatch eBPF probes (bpf-el object)"
license = "MIT"

[features]
# build.rs reserves no features, so the header must be on by default.
default = ["ebpf"]
ebpf = []

[dependencies]
aya-ebpf = "0.2"
bytemuck = { version = "1", default-features = false, features = ["derive"] }

[[bin]]
name = "sigmacatch-ebpf"
path = "src/main.rs"

[package.metadata.cargo-machete]
# bytemuck is only referenced from the feature-gated header; machete can't see it.
ignored = ["bytemuck"]

[profile.release]
strip = true
debug = false
lto = true
codegen-units = 1
panic = "abort"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
style = "warn"
complexity = "warn"
perf = "warn"
