[package]
name = "sigmacatch"
version.workspace = true
edition.workspace = true
description = "sigmacatch — Sigma regression collector (single binary, inputs via cargo features)"
license.workspace = true

# Library doc blocks may reference items by their old crate names; keep
# doctests off (same policy as the merged crates had).
[lib]
doctest = false

# Inputs are selected with cargo features:
#   Windows: winevt (live Event Log), evtx (one-shot EVTX files)
#   Linux:   auditd, builtin (system syslog), sysmon (Sysmon-for-Linux tail), ebpf (native probes)
# At runtime, `--evtx <PATH>` selects the EVTX one-shot, `winevt` the live
# collector (Windows), and the Linux inputs run in parallel.
#
# Everything else (runner, detection, rules, repo, regression data generator)
# is OS-independent and always compiled in. The `regressiondata-check` bin is
# a second artifact of this package and needs no input features.
[features]
default = ["winevt"]
winevt = []
evtx = ["dep:walkdir"]
auditd = []
builtin = ["dep:regex"]
sysmon = ["builtin"]                          # Sysmon-for-Linux legacy tail
ebpf = ["dep:aya", "dep:bytemuck", "dep:hex"]

[target.'cfg(not(unix))'.dependencies]
dunce = "1.0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_EventLog",
  "Win32_System_Threading",
  "Win32_Security",
] }

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
aya = { version = "0.16.0", optional = true }
bytemuck = { version = "1.25.2", default-features = false, features = [
  "derive",
], optional = true }
chrono = "0.4.45"
crc32fast = "1.5.4"
evtx = "0.15.1"
flate2 = "1.1.11"
grit-lib = "0.5.31"
hex = { version = "0.4.3", optional = true }
linux-audit-parser = "0.2.8"
phf = { version = "0.14.0", features = ["macros"] }
rayon = "1.12.0"
regex = { version = "1.13.1", optional = true }
roxmltree = "0.21.2"
rsigma-eval = { version = "0.26.0", features = ["daachorse-index", "parallel"] }
rsigma-parser = "0.26.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
sha1 = "0.11.0"
sha2 = "0.11.1"
ssh-key = { version = "0.6.7", features = ["alloc", "ed25519"] }
thiserror.workspace = true
tokio = { version = "1.54.1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "signal",
] }
tracing.workspace = true
tracing-appender = "0.2.5"
tracing-subscriber.workspace = true
uuid = { version = "1.29.1", features = ["v4", "serde"] }
walkdir = { version = "2.5.0", optional = true }

[dev-dependencies]
rand_core = { version = "0.6.4", features = ["getrandom"] }
tempfile = "3.27.0"

# Integration tests: each requires its input features compiled in.
[[test]]
name = "auditd_collector"
required-features = ["auditd", "builtin"]

[[test]]
name = "syslog_collector"
required-features = ["builtin"]

[[test]]
name = "syslog_e2e"
required-features = ["auditd", "builtin"]

# End-to-end against the legacy Sysmon-for-Linux tail.
[[test]]
name = "sysmon_e2e"
required-features = ["auditd", "builtin", "sysmon"]

# Diagnostics eBPF-only (parses the embedded probe object).
[[example]]
name = "ebpf_parse_check"
required-features = ["ebpf"]

# Quality contract: inherit workspace lint tiers ([workspace.lints] in root Cargo.toml).
[lints]
workspace = true
