[package]
name = "sigmacatch"
version.workspace = true
edition.workspace = true
description = "sigmacatch — Sigma regression collector (single binary, inputs via cargo features)"
license.workspace = true

# Library doc blocks may reference items by their old crate names; keep
# doctests off (same policy as the merged crates had).
[lib]
doctest = false

[features]
default = ["winevt"]
winevt = ["dep:sigmacatch-input-winevt"]
evtx = ["dep:sigmacatch-input-evtx"]
etw = ["dep:sigmacatch-input-etw"]                  # native Windows ETW (no Sysmon)
driver = ["etw", "dep:sigmacatch-input-etw-driver"]  # kernel sensor client (Windows)
auditd = ["dep:sigmacatch-input-auditd", "dep:sigmacatch-input-tail"]
builtin = ["dep:sigmacatch-input-syslog", "dep:sigmacatch-input-tail"]
sysmon = ["builtin", "dep:sigmacatch-input-sysmon"] # Sysmon-for-Linux legacy tail
ebpf = ["dep:sigmacatch-input-ebpf", "sigmacatch-input-ebpf/ebpf"]
macos = ["dep:sigmacatch-input-macos"]

# Linux input crates are empty shells on other targets, so their re-exports in
# `inputs/mod.rs` are Linux-only too. Target scoping keeps the dependency lint
# quiet when a Linux feature is enabled on a Windows build.
[target.'cfg(target_os = "linux")'.dependencies]
sigmacatch-input-auditd = { path = "inputs/auditd", optional = true }
sigmacatch-input-ebpf = { path = "inputs/ebpf", optional = true }
sigmacatch-input-syslog = { path = "inputs/syslog", optional = true }
sigmacatch-input-sysmon = { path = "inputs/sysmon", optional = true }
sigmacatch-input-tail = { path = "inputs/tail", optional = true }

# The ETW inputs are empty shells off Windows, like the Linux input crates.
# Target scoping keeps the dependency lint quiet when an ETW feature is enabled
# on Linux (e.g. `cargo clippy --all-features`).
[target.'cfg(windows)'.dependencies]
sigmacatch-input-etw = { path = "inputs/etw", optional = true }
sigmacatch-input-etw-driver = { path = "inputs/etw-driver", optional = true }

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sigma-regression = { path = "sigma-regression" }
sigmacatch-core = { path = "core" }
sigmacatch-output-regression = { path = "outputs/regression" }
sigmacatch-input-evtx = { path = "inputs/evtx", optional = true }
sigmacatch-input-macos = { path = "inputs/macos", optional = true }
sigmacatch-input-winevt = { path = "inputs/winevt", optional = true }
tokio = { version = "1.54.1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "signal",
  "fs",
  "io-util",
  "process",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "auditd_collector"
required-features = ["auditd", "builtin"]

[[test]]
name = "syslog_collector"
required-features = ["builtin"]

[[test]]
name = "syslog_e2e"
required-features = ["auditd", "builtin"]

[[test]]
name = "sysmon_e2e"
required-features = ["auditd", "builtin", "sysmon"]

[lints]
workspace = true
