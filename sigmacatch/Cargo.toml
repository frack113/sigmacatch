[package]
name = "sigmacatch"
version = "0.2.0"
edition = "2021"
description = "Capture real Windows events and match them against Sigma rules to produce regression data"
license = "MIT"

[[bin]]
name = "sigmacatch"
path = "src/main.rs"

[dependencies]
# Crate workspace — application configuration
sigmacatch-config = { path = "../crates/sigmacatch-config" }

# Crate workspace — logging setup
sigmacatch-logger = { path = "../crates/sigmacatch-logger" }

# Crate workspace — detection engine
sigmacatch-detection = { path = "../crates/sigmacatch-detection" }

# Crate workspace — shared types
sigmacatch-types = { path = "../crates/sigmacatch-types" }

# Crate workspace — Windows channel mappings (replaces sigma-mapping)
input-windows-channels = { path = "../crates/input-windows-channels" }

# Crate workspace — SigmaHQ regression data format
sigmacatch-regression = { path = "../crates/sigmacatch-regression" }

# Crate workspace — EVTX parsing
input-evtx = { path = "../crates/input-evtx" }

# Crate workspace — Sigma rule management
sigmacatch-rule = { path = "../crates/sigmacatch-rule" }

# Crate workspace — Git operations
sigmacatch-repo = { path = "../crates/sigmacatch-repo" }

# Sérialisation
serde_json = "1.0"
# Async
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal"] }

# Logs
tracing = "0.1"

# Utilitaires
anyhow = "1.0"

uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_EventLog",
    "Win32_System_Threading",
    "Win32_Security",
] }
