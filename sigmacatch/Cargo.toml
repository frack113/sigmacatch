[package]
name = "sigmacatch"
version.workspace = true
edition.workspace = true
description = "sigmacatch — Sigma regression collector (single binary, inputs via cargo features)"
license.workspace = true

# Library doc blocks may reference items by their old crate names; keep
# doctests off (same policy as the merged crates had).
[lib]
doctest = false

# `md-5` is only reachable from the Windows `etw` path (`inputs/windows/nt_file.rs`)
# and its crate name (`md5`) does not match the package name, which is what the
# unused-dependency scan looks for.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[features]
default = ["winevt"]
winevt = []
evtx = ["dep:walkdir"]
etw = ["dep:md-5"]                            # native Windows ETW (no Sysmon)
driver = ["etw"]                               # kernel sensor client (Windows)
auditd = ["dep:sigmacatch-input-tail"]
builtin = ["dep:regex", "dep:sigmacatch-input-tail"]
sysmon = ["builtin"]                          # Sysmon-for-Linux legacy tail
ebpf = ["dep:sigmacatch-input-ebpf", "sigmacatch-input-ebpf/ebpf"]
# Plan A (system.log/os_log) needs no extra dependency; Plan B (Endpoint
# Security) pulls the macOS-only bindings, so they are optional and only
# activated with this feature.
macos = ["dep:endpoint-sec", "dep:libc"]

[target.'cfg(not(unix))'.dependencies]
dunce = "1.0.5"

# Endpoint Security is a macOS-only framework: the bindings are declared in a
# target table so a Linux/Windows build never tries to link them. `max`
# compiles every ES event type up to macOS 15.4; the collector still filters
# subscriptions by the runtime macOS version.
[target.'cfg(target_os = "macos")'.dependencies]
endpoint-sec = { version = "0.6.2", features = ["max"], optional = true }
libc = { version = "0.2.188", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_WinTrust",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_EventLog",
  "Win32_System_IO",
  "Win32_System_Kernel",
  "Win32_System_Threading",
  "Win32_System_Time",
] }

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
linux-audit-parser = "0.2.8"
rayon = "1.12.0"
regex = { version = "1.13.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sigmacatch-core = { path = "core" }
sigmacatch-input-ebpf = { path = "inputs/ebpf", optional = true }
sigmacatch-input-tail = { path = "inputs/tail", optional = true }
md-5 = { version = "0.11.0", optional = true }
sha1 = "0.11.0"
tokio = { version = "1.54.1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "signal",
  "fs",
  "io-util",
  "process",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1.29.3", features = ["v4", "serde"] }
walkdir = { version = "2.5.1", optional = true }

[dev-dependencies]
md-5 = "0.11.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
tempfile = "3.27.0"

[[test]]
name = "auditd_collector"
required-features = ["auditd", "builtin"]

[[test]]
name = "syslog_collector"
required-features = ["builtin"]

[[test]]
name = "syslog_e2e"
required-features = ["auditd", "builtin"]

[[test]]
name = "sysmon_e2e"
required-features = ["auditd", "builtin", "sysmon"]

[[example]]
name = "etw_dump"
required-features = ["etw"]

[[example]]
name = "etw_driver_probe"
required-features = ["driver"]

[lints]
workspace = true
