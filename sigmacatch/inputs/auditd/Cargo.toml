[package]
name = "sigmacatch-input-auditd"
version.workspace = true
edition.workspace = true
description = "sigmacatch Linux auditd log collector"
license.workspace = true

[lib]
doctest = false

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
linux-audit-parser = "0.2.8"
serde_json = "1.0.154"
sigmacatch-core = { path = "../../../common/core" }
sigmacatch-input-tail = { path = "../tail" }
tokio = { version = "1.54.1", features = ["rt", "sync"] }
tracing.workspace = true

[lints]
workspace = true
