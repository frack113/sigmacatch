[package]
name = "sigmacatch-input-etw"
version.workspace = true
edition.workspace = true
description = "sigmacatch native Windows ETW collector"
license.workspace = true

[lib]
doctest = false

# Realtime ETW sessions only exist on Windows. Target-scoping keeps the crate
# empty — and warning-free — on Linux while the host still enables the feature.
[target.'cfg(target_os = "windows")'.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
sigmacatch-core = { path = "../../core" }
sigmacatch-input-etw-common = { path = "../etw-common" }
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tracing.workspace = true
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Threading",
  "Win32_System_Time",
] }

[lints]
workspace = true
