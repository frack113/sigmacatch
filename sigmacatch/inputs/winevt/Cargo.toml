[package]
name = "sigmacatch-input-winevt"
version.workspace = true
edition.workspace = true
description = "sigmacatch Windows Event Log channel collector"
license.workspace = true

[lib]
doctest = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
sigmacatch-core = { path = "../../../common/core" }
sigmacatch-runner = { path = "../../../runner" }
tokio = { version = "1.54.1", features = ["rt", "sync"] }
tracing.workspace = true

# The Win32 tail is compiled only on Windows; off Windows the crate still
# exposes the target-independent idle-reset helper and its unit tests.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_EventLog",
] }

[lints]
workspace = true
