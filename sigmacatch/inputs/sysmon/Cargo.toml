[package]
name = "sigmacatch-input-sysmon"
version.workspace = true
edition.workspace = true
description = "sigmacatch Sysmon-for-Linux log collector"
license.workspace = true

[lib]
doctest = false

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
sigmacatch-core = { path = "../../core" }
sigmacatch-input-syslog = { path = "../syslog" }
sigmacatch-input-tail = { path = "../tail" }
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
