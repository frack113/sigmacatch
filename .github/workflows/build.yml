name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    name: Supply-chain gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      # `cargo deny` runs once, in audit.yml; this job only checks for unused
      # dependencies. Cache the install-action binary.
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-machete
      - run: cargo machete

  # CI validates compilation and feature gates, not codegen: the flavours
  # build in debug. The release check stays mandatory locally before every
  # PR (`cargo xwin build --release`, see CONTRIBUTING.md).
  #
  # base + sysmon share one target/ dir: the sysmon build is incremental over
  # the base (same dep tree — sysmon only re-compiles the sigmacatch crate).
  # `--all-targets` also builds the regressiondata-check bin, which the
  # regression check steps below run in place (no separate job).
  linux:
    name: Linux (auditd+builtin, sysmon)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (auditd+builtin, --all-targets)
        run: cargo build --locked -p sigmacatch --no-default-features --features auditd,builtin --all-targets
      - name: Build (auditd+builtin+sysmon)
        run: cargo build --locked -p sigmacatch --no-default-features --features auditd,builtin,sysmon
      - name: Run regression checks
        run: |
          out=$(./target/debug/regressiondata-check --json --path sigmacatch/tests/fixtures/sigma)
          printf '%s\n' "$out"
          jq -e '.total == 2 and .failed_count == 0' <<<"$out"
      - name: Negative — broken fixture fails (and --ignore must not mask it)
        run: |
          neg="$RUNNER_TEMP/regress-negative"
          rm -rf "$neg"
          cp -r sigmacatch/tests/fixtures/sigma "$neg"
          rm "$neg/rules/windows/builtin/win_alert_mimikatz_keywords.yml"
          set +e
          out=$(./target/debug/regressiondata-check --json --path "$neg")
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ]
          jq -e '.failed_count >= 1' <<<"$out"
          set +e
          out=$(./target/debug/regressiondata-check --json --ignore --path "$neg")
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ]
      - name: --fix reproduces the normalized tree on a throwaway copy
        run: |
          tmp="$RUNNER_TEMP/regress-malformed"
          rm -rf "$tmp"
          cp -r sigmacatch/tests/fixtures/sigma "$tmp"
          json="$tmp/regression_data/rules/windows/builtin/win_alert_mimikatz_keywords/06d71506-7beb-4f22-8888-e2e5e2ca7fd8.json"
          info="$tmp/regression_data/rules/windows/builtin/win_alert_mimikatz_keywords/info.yml"
          truncate -s -1 "$json"
          sed -i 's/^    /  /' "$info"
          ./target/debug/regressiondata-check --fix --path "$tmp"
          diff -r "$tmp" sigmacatch/tests/fixtures/sigma
          git diff --exit-code

  # ebpf needs nightly + rust-src + bpf-linker (build.rs) and must stay its
  # own target dir — it changes the execution path and is never merged with
  # the sysmon flavour.
  linux-ebpf:
    name: Linux (ebpf)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ebpf
        with:
          rust-cache-key: linux-ebpf-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (auditd+builtin+ebpf)
        run: cargo +nightly build --locked -p sigmacatch --no-default-features --features auditd,builtin,ebpf

  # winevt + winevt-evtx share one target/ dir: the evtx build is incremental
  # (only walkdir joins the dep tree).
  windows:
    name: Windows (winevt, winevt+evtx)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-${{ hashFiles('**/Cargo.lock') }}
      - name: Build flavours
        shell: bash
        run: |
          cargo build --locked --target x86_64-pc-windows-msvc -p sigmacatch --all-targets
          cargo build --locked --target x86_64-pc-windows-msvc -p sigmacatch --features winevt,evtx

  # The macOS binary cannot be linked from Linux (no macOS SDK), so the ES
  # flavour must be built on a macOS runner. The intel runner matches the
  # x86_64 artefacts produced for the other platforms.
  macos:
    name: macOS (Endpoint Security)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (Endpoint Security, --all-targets)
        run: >
          cargo build --locked --target x86_64-apple-darwin -p sigmacatch
          --no-default-features --features macos --all-targets
