name: Build

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    name: Supply-chain gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      # Cache the install-action tool cache (cargo-deny / cargo-machete binaries).
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo deny check
      - run: cargo machete

  linux:
    name: Linux — ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # base + regressiondata-check built together with --all-targets
          - flavor: base
            features: --no-default-features --features auditd,builtin
            nightly: false
            build_bins: true
          - flavor: sysmon
            features: --no-default-features --features auditd,builtin,sysmon
            nightly: false
            build_bins: false
          - flavor: ebpf
            features: --no-default-features --features auditd,builtin,ebpf
            nightly: true
            build_bins: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - name: Install nightly + bpf-linker (ebpf only)
        if: matrix.nightly
        run: |
          rustup toolchain install nightly --component rust-src
          if [ ! -x "${{ runner.tool_cache }}/bpf-linker/bpf-linker" ]; then
            curl -sL -o /tmp/bpf-linker.tar.zst \
              "https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
            mkdir -p "${{ runner.tool_cache }}/bpf-linker"
            tar --zstd -xf /tmp/bpf-linker.tar.zst -C "${{ runner.tool_cache }}/bpf-linker"
          fi
          echo "${{ runner.tool_cache }}/bpf-linker" >> "$GITHUB_PATH"
      - name: Cache bpf-linker
        if: matrix.nightly
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/bpf-linker
          key: bpf-linker-0.11.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-${{ matrix.flavor }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Build flavour
        run: |
          if [ "${{ matrix.build_bins }}" = "true" ]; then
            cargo build --release --locked -p sigmacatch ${{ matrix.features }} --all-targets
          else
            cargo build --release --locked -p sigmacatch ${{ matrix.features }}
          fi

  windows:
    name: Windows — ${{ matrix.flavor }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # winevt + regressiondata-check built together
          - flavor: winevt
            features: ""
            build_bins: true
          - flavor: winevt-evtx
            features: --features winevt,evtx
            build_bins: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-${{ matrix.flavor }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Build flavour
        shell: bash
        run: |
          if [ "${{ matrix.build_bins }}" = "true" ]; then
            cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch ${{ matrix.features }} --all-targets
          else
            cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch ${{ matrix.features }}
          fi

  regression-check:
    name: Regression data validator (fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-base-${{ hashFiles('**/Cargo.lock') }}
      - name: Build regressiondata-check
        run: cargo build --release --locked -p sigmacatch --bin regressiondata-check
      - name: Run regression checks
        run: |
          ./target/release/regressiondata-check --json --path sigmacatch/tests/fixtures/sigma
          out=$(./target/release/regressiondata-check --json --path sigmacatch/tests/fixtures/sigma)
          printf '%s\n' "$out"
          jq -e '.total == 2 and .failed_count == 0' <<<"$out"
      - name: Negative — broken fixture fails (and --ignore must not mask it)
        run: |
          set +e
          out=$(./target/release/regressiondata-check --json --path sigmacatch/tests/fixtures/sigma_negative)
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ]
          jq -e '.failed_count >= 1' <<<"$out"
          set +e
          out=$(./target/release/regressiondata-check --json --ignore --path sigmacatch/tests/fixtures/sigma_negative)
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ]
      - name: --fix reproduces the normalized reference on a throwaway copy
        run: |
          tmp="$RUNNER_TEMP/regress-malformed"
          cp -r sigmacatch/tests/fixtures/sigma_malformed "$tmp"
          ./target/release/regressiondata-check --fix --path "$tmp"
          diff -r "$tmp" sigmacatch/tests/fixtures/sigma_malformed_reference
          git diff --exit-code