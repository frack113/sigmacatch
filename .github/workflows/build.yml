name: Build

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    name: Supply-chain gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      # Cache the install-action tool cache (cargo-deny / cargo-machete binaries).
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo deny check
      - run: cargo machete

  # CI validates compilation and feature gates, not codegen: the flavours
  # build in debug. The release check stays mandatory locally before every
  # PR (`cargo xwin build --release`, see CONTRIBUTING.md).
  #
  # base + sysmon share one target/ dir: the sysmon build is incremental over
  # the base (same dep tree — sysmon only re-compiles the sigmacatch crate).
  # `--all-targets` also builds the regressiondata-check bin, which the
  # regression check steps below run in place (no separate job).
  linux:
    name: Linux (auditd+builtin, sysmon)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (auditd+builtin, --all-targets)
        run: cargo build --locked -p sigmacatch --no-default-features --features auditd,builtin --all-targets
      - name: Build (auditd+builtin+sysmon)
        run: cargo build --locked -p sigmacatch --no-default-features --features auditd,builtin,sysmon
      - name: Run regression checks
        run: |
          ./target/debug/regressiondata-check --json --path sigmacatch/tests/fixtures/sigma
          out=$(./target/debug/regressiondata-check --json --path sigmacatch/tests/fixtures/sigma)
          printf '%s\n' "$out"
          jq -e '.total == 2 and .failed_count == 0' <<<"$out"
      - name: Negative — broken fixture fails (and --ignore must not mask it)
        run: |
          set +e
          out=$(./target/debug/regressiondata-check --json --path sigmacatch/tests/fixtures/sigma_negative)
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ]
          jq -e '.failed_count >= 1' <<<"$out"
          set +e
          out=$(./target/debug/regressiondata-check --json --ignore --path sigmacatch/tests/fixtures/sigma_negative)
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ]
      - name: --fix reproduces the normalized reference on a throwaway copy
        run: |
          tmp="$RUNNER_TEMP/regress-malformed"
          cp -r sigmacatch/tests/fixtures/sigma_malformed "$tmp"
          ./target/debug/regressiondata-check --fix --path "$tmp"
          diff -r "$tmp" sigmacatch/tests/fixtures/sigma_malformed_reference
          git diff --exit-code

  # ebpf needs nightly + rust-src + bpf-linker (build.rs) and must stay its
  # own target dir — it changes the execution path and is never merged with
  # the sysmon flavour.
  linux-ebpf:
    name: Linux (ebpf)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache nightly toolchain
        # Pinned nightly: bump the month in the key when the ebpf probe
        # build breaks on the cached toolchain.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup
          key: rustup-nightly-2026-10-${{ runner.os }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - name: Install bpf-linker (static musl release)
        run: |
          if [ ! -x "${{ runner.tool_cache }}/bpf-linker/bpf-linker" ]; then
            curl -sL -o /tmp/bpf-linker.tar.zst \
              "https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
            mkdir -p "${{ runner.tool_cache }}/bpf-linker"
            tar --zstd -xf /tmp/bpf-linker.tar.zst -C "${{ runner.tool_cache }}/bpf-linker"
          fi
          echo "${{ runner.tool_cache }}/bpf-linker" >> "$GITHUB_PATH"
      - name: Cache bpf-linker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/bpf-linker
          key: bpf-linker-0.11.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-ebpf-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (auditd+builtin+ebpf)
        run: cargo +nightly build --locked -p sigmacatch --no-default-features --features auditd,builtin,ebpf

  # winevt + winevt-evtx share one target/ dir: the evtx build is incremental
  # (only walkdir joins the dep tree).
  windows:
    name: Windows (winevt, winevt+evtx)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-${{ hashFiles('**/Cargo.lock') }}
      - name: Build flavours
        shell: bash
        run: |
          cargo build --locked --target x86_64-pc-windows-msvc -p sigmacatch --all-targets
          cargo build --locked --target x86_64-pc-windows-msvc -p sigmacatch --features winevt,evtx
