name: Build

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    name: Supply-chain gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      # Cache the install-action tool cache (cargo-deny / cargo-machete binaries).
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo deny check
      - run: cargo machete

  linux:
    name: Linux — ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each flavour runs on its own runner + target dir, so a superset
          # feature build can no longer clobber an earlier-named bin in a
          # shared target dir (the reason the old job built them sequentially).
          - flavor: base
            bin: sigmacatch-linux
            features: auditd,builtin
            mode: build
            nightly: false
          - flavor: sysmon
            bin: sigmacatch-linux-sysmon
            features: auditd,builtin,sysmon
            mode: check
            nightly: false
          - flavor: ebpf
            bin: sigmacatch-linux-ebpf
            features: auditd,builtin,ebpf
            mode: check
            nightly: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Install nightly + bpf-linker (ebpf only)
        if: matrix.nightly
        run: |
          rustup toolchain install nightly --component rust-src
          if [ ! -x "${{ runner.tool_cache }}/bpf-linker/bpf-linker" ]; then
            curl -sL -o /tmp/bpf-linker.tar.zst \
              "https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
            mkdir -p "${{ runner.tool_cache }}/bpf-linker"
            tar --zstd -xf /tmp/bpf-linker.tar.zst -C "${{ runner.tool_cache }}/bpf-linker"
          fi
          echo "${{ runner.tool_cache }}/bpf-linker" >> "$GITHUB_PATH"
      - name: Cache bpf-linker
        if: matrix.nightly
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/bpf-linker
          key: bpf-linker-0.11.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build / check flavour
        run: |
          if [ -n "${{ matrix.bin }}" ]; then
            cargo ${{ matrix.mode }} --release --locked -p sigmacatch-lnx \
              --bin ${{ matrix.bin }} --no-default-features --features ${{ matrix.features }}
          else
            cargo ${{ matrix.mode }} --release --locked -p sigmacatch-lnx \
              --no-default-features --features ${{ matrix.features }}
          fi

  windows:
    name: Windows — ${{ matrix.flavor }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each flavour on its own Windows runner + target dir so the
          # sequential recompiles (full / per-feature / check) run in parallel.
          - flavor: channel+etw
            command: cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch-win
          - flavor: winevt
            command: cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch-win --no-default-features --features winevt
          - flavor: etw
            command: cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch-win --no-default-features --features etw
          - flavor: check
            command: cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ${{ matrix.command }}
