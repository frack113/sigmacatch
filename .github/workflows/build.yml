name: Build

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux — 3 flavours
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: rustup toolchain install nightly --component rust-src
      - name: Install bpf-linker (static musl release)
        run: |
          curl -sL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/latest/download/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          mkdir -p "$HOME/.local/bin"
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build all 3 flavours
        run: |
          cargo build --release --locked -p sigmacatch-lnx --no-default-features --features auditd,builtin
          cargo build --release --locked -p sigmacatch-lnx --no-default-features --features auditd,builtin,sysmon
          cargo build --release --locked -p sigmacatch-lnx --no-default-features --features auditd,builtin,ebpf
      - name: Isolated feature builds
        run: |
          cargo build --release --locked -p sigmacatch-lnx --no-default-features --features tools

  windows:
    name: Windows x64 (MSVC) — sigmacatch-channel + sigmacatch-etw
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch-win
      - name: Isolated feature builds (one collector per binary)
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch-win --no-default-features --features winevt
          cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch-win --no-default-features --features etw
          cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch-win --no-default-features --features tools
