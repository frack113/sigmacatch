name: Lint YAML

on:
  push:
    branches: [main]
    paths:
      - 'detection/src/pipelines/*.yml'
      - '.yamllint'
  pull_request:
    branches: [main]
    paths:
      - 'detection/src/pipelines/*.yml'
      - '.yamllint'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install yamllint
        run: pip install yamllint==1.38.0 --quiet
      - name: Lint pipeline YAML files
        run: yamllint -f parsable --config-file .yamllint detection/src/pipelines/
