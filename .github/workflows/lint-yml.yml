name: Lint YAML

on:
  push:
    paths:
      - 'crates/sigmacatch-detection/pipelines/*.yml'
      - '.yamllint'
  pull_request:
    branches: [main]
    paths:
      - 'crates/sigmacatch-detection/pipelines/*.yml'
      - '.yamllint'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install yamllint
        run: pip install yamllint --quiet
      - name: Lint pipeline YAML files
        run: yamllint -f parsable --config-file .yamllint crates/sigmacatch-detection/pipelines/
