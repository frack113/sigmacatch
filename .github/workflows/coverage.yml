name: Coverage

# The coverage numbers only move when Rust source or the dependency tree
# changes, so the gates are path-gated and do not sit on the critical path
# of every PR. The instrumented build is a full workspace recompile, which
# is why it lives in its own workflow.
on:
  # `paths` and `paths-ignore` cannot be combined for the same event — the
  # exclusions are negated patterns inside `paths`.
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/coverage.yml'
      - '!docs/**'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/coverage.yml'
      - '!docs/**'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Anti-regression coverage gate (Q7.3): fails the build when line coverage of
  # the Linux-compilable input set drops below the threshold. `winevt` is a
  # no-op stub on Linux, so the gate runs on the rest of the stable feature
  # matrix. The `ebpf` half of the feature matrix needs nightly + bpf-linker
  # and is gated separately by `coverage-ebpf` below.
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage-stable-${{ hashFiles('**/Cargo.lock') }}
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.0
      - name: Coverage gate (auditd+builtin+sysmon+evtx)
        run: |
          cargo llvm-cov --locked --workspace --all-targets \
            --no-default-features --features auditd,builtin,sysmon,evtx \
            --fail-under-lines 78

  # Companion gate for the `ebpf` input (Q7.3). Without it, the host adapter
  # in `collector/ebpf/` sits outside every coverage number in the
  # project.
  #
  # Scope, stated precisely so the number is not over-read:
  #   - This measures the *host-side* ebpf code only (1 341 lines before the
  #     crate extraction). The nested `sensor/ebpf` kernel probe is a
  #     separate workspace built for `bpfel-unknown-none`, and llvm-cov cannot
  #     instrument those objects — it does not appear in the report. Closing
  #     that last 478 lines would need in-kernel verification, not a coverage
  #     gate.
  #   - `ebpf.rs` (62.9%) and `ebpf_common.rs` (32.8%) need a privileged kernel
  #     to exercise the attach path, so they drag the average down; the parsers
  #     in `ebpf_event.rs` sit at 96.8%. Those ratios predate the extraction.
  #   - Measured 78.43% on 2026-09-26. The bar is 77, not the stable gate's 78,
  #     to absorb line-count drift between nightly releases.
  coverage-ebpf:
    name: Coverage gate (ebpf)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ebpf
        with:
          rust-cache-key: coverage-ebpf-${{ hashFiles('**/Cargo.lock') }}
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.0
      - name: Coverage gate (auditd+builtin+ebpf)
        run: |
          cargo +nightly llvm-cov --locked --workspace --all-targets \
            --no-default-features --features auditd,builtin,ebpf \
            --fail-under-lines 77
