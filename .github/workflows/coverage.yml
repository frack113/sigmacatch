name: Coverage

# The coverage numbers only move when Rust source or the dependency tree
# changes, so the gates are path-gated and do not sit on the critical path
# of every PR. The instrumented build is a full workspace recompile, which
# is why it lives in its own workflow.
on:
  # `paths` and `paths-ignore` cannot be combined for the same event — the
  # exclusions are negated patterns inside `paths`.
  push:
    paths:
      - 'sigmacatch/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '!docs/**'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'sigmacatch/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '!docs/**'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Anti-regression coverage gate (Q7.3): fails the build when line coverage of
  # the Linux-compilable input set drops below the threshold. `winevt` is a
  # no-op stub on Linux, so the gate runs on the rest of the stable feature
  # matrix. The `ebpf` half of the feature matrix needs nightly + bpf-linker
  # and is gated separately by `coverage-ebpf` below.
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage-stable-${{ hashFiles('**/Cargo.lock') }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Coverage gate (auditd+builtin+sysmon+evtx)
        run: |
          cargo llvm-cov --locked --workspace --all-targets \
            --no-default-features --features auditd,builtin,sysmon,evtx \
            --fail-under-lines 78

  # Companion gate for the `ebpf` input (Q7.3). Without it, inputs/ebpf.rs and
  # inputs/ebpf_event.rs sit outside every coverage number in the project.
  #
  # Scope, stated precisely so the number is not over-read:
  #   - This measures the *host-side* ebpf code only (1 341 lines). The nested
  #     `sigmacatch/ebpf` kernel probe is a separate workspace built for
  #     `bpfel-unknown-none`, and llvm-cov cannot instrument those objects — it
  #     does not appear in the report. Closing that last 478 lines would need
  #     in-kernel verification, not a coverage gate.
  #   - `inputs/ebpf.rs` (62.9%) and `ebpf_common.rs` (32.8%) need a privileged
  #     kernel to exercise the attach path, so they drag the average down; the
  #     parsers in `inputs/ebpf_event.rs` sit at 96.8%.
  #   - Measured 78.43% on 2026-09-26. The bar is 77, not the stable gate's 78,
  #     to absorb line-count drift between nightly releases.
  coverage-ebpf:
    name: Coverage gate (ebpf)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache nightly toolchain
        # Pinned nightly: bump the month in the key when the ebpf probe
        # build breaks on the cached toolchain.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup
          key: rustup-nightly-2026-10-${{ runner.os }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - name: Install bpf-linker (static musl release)
        run: |
          if [ ! -x "${{ runner.tool_cache }}/bpf-linker/bpf-linker" ]; then
            curl -sL -o /tmp/bpf-linker.tar.zst \
              "https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
            mkdir -p "${{ runner.tool_cache }}/bpf-linker"
            tar --zstd -xf /tmp/bpf-linker.tar.zst -C "${{ runner.tool_cache }}/bpf-linker"
          fi
          echo "${{ runner.tool_cache }}/bpf-linker" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage-ebpf-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache bpf-linker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/bpf-linker
          key: bpf-linker-0.11.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Coverage gate (auditd+builtin+ebpf)
        run: |
          cargo +nightly llvm-cov --locked --workspace --all-targets \
            --no-default-features --features auditd,builtin,ebpf \
            --fail-under-lines 77
