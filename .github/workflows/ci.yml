name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap gate: decide whether the instrumented coverage jobs have anything
  # to measure. The rest of CI only runs when Rust source or the dependency
  # tree changes.
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Push events compare against the commit before the push with git;
          # keep the history available. Pull requests use the REST API.
          fetch-depth: 0
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'

  # Single gate for every code job: formatting, clippy over the Linux
  # collectors, and unused-dependency detection. A failure here skips every
  # build and test job below.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Share the dependency cache with the Linux test job, which starts
          # only after this one succeeds.
          shared-key: linux
      - run: cargo fmt --check
      # Lint the Linux collectors, not just the `winevt` stub the default
      # feature selects on Linux.
      - run: >
          cargo clippy --locked --all-targets --no-default-features
          --features auditd,builtin,sysmon,evtx -- -W warnings
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-machete@0.10.1
      - run: cargo machete

  # The stable feature matrix runs in one job so every invocation shares a
  # single target/ dir: the dependency tree (tokio, rsigma, …) is compiled
  # once, and only the feature-gated deps (regex, walkdir) plus the
  # sigmacatch crate are rebuilt per feature combination.
  linux:
    name: Linux (auditd+builtin, sysmon)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: linux
      - name: Test (winevt)
        run: cargo test --locked -p sigmacatch
      # One invocation for every Linux-buildable crate except the eBPF probe
      # (nightly + bpf-linker): cargo resolves and compiles the shared
      # dependency tree once instead of once per step.
      - name: Test (workspace crates)
        run: >
          cargo test --locked
          -p sigmacatch-core
          -p sigmacatch-detection
          -p sigmacatch-runner
          -p sigmacatch-input-tail
          -p sigma-regression
          -p sigmacatch-repo
          -p sigmacatch-output-evtx
          -p sigmacatch-output-regression
          -p sigmacatch-input-etw-common
          -p sigmacatch-input-etw
          -p sigmacatch-input-etw-driver
          -p sigmacatch-input-auditd
          -p sigmacatch-input-syslog
          -p sigmacatch-input-sysmon
          -p sigmacatch-input-winevt
          -p sigmacatch-input-evtx
          -p sigmacatch-input-macos
      - name: Test (auditd+builtin+sysmon)
        run: cargo test --locked -p sigmacatch --no-default-features --features auditd,builtin,sysmon
      - name: Test (evtx)
        run: cargo test --locked -p sigmacatch --no-default-features --features evtx
      - name: Test (macOS event model, on Linux)
        run: cargo test --locked -p sigmacatch --no-default-features --features macos
      # `--all-targets` builds the regressiondata-check bin, which the
      # regression checks below run in place (no separate job).
      - name: Build (auditd+builtin, --all-targets)
        run: cargo build --locked -p sigmacatch --no-default-features --features auditd,builtin --all-targets
      - name: Build (auditd+builtin+sysmon)
        run: cargo build --locked -p sigmacatch --no-default-features --features auditd,builtin,sysmon
      - name: Run regression checks
        run: |
          out=$(./target/debug/regressiondata-check --json --path sigmacatch/tests/fixtures/sigma)
          printf '%s\n' "$out"
          jq -e '.total == 2 and .failed_count == 0' <<<"$out"
      - name: Negative — broken fixture fails (and --ignore must not mask it)
        run: |
          neg="$RUNNER_TEMP/regress-negative"
          rm -rf "$neg"
          cp -r sigmacatch/tests/fixtures/sigma "$neg"
          rm "$neg/rules/windows/builtin/win_alert_mimikatz_keywords.yml"
          set +e
          out=$(./target/debug/regressiondata-check --json --path "$neg")
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ]
          jq -e '.failed_count >= 1' <<<"$out"
          set +e
          out=$(./target/debug/regressiondata-check --json --ignore --path "$neg")
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ]
      - name: --fix reproduces the normalized tree on a throwaway copy
        run: |
          tmp="$RUNNER_TEMP/regress-malformed"
          rm -rf "$tmp"
          cp -r sigmacatch/tests/fixtures/sigma "$tmp"
          json="$tmp/regression_data/rules/windows/builtin/win_alert_mimikatz_keywords/06d71506-7beb-4f22-8888-e2e5e2ca7fd8.json"
          info="$tmp/regression_data/rules/windows/builtin/win_alert_mimikatz_keywords/info.yml"
          truncate -s -1 "$json"
          sed -i 's/^    /  /' "$info"
          ./target/debug/regressiondata-check --fix --path "$tmp"
          diff -r "$tmp" sigmacatch/tests/fixtures/sigma
          git diff --exit-code

  # eBPF needs nightly + rust-src + bpf-linker (build.rs) and must stay its
  # own target dir — it changes the execution path and is never merged with
  # the sysmon flavour.
  linux-ebpf:
    name: Linux (ebpf)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ebpf
        with:
          rust-cache-key: linux-ebpf-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (auditd+builtin+ebpf)
        run: cargo +nightly build --locked -p sigmacatch --no-default-features --features auditd,builtin,ebpf
      - name: Test (auditd+builtin+ebpf)
        run: cargo +nightly test --locked -p sigmacatch --no-default-features --features auditd,builtin,ebpf
      - name: Test eBPF host adapter
        run: cargo +nightly test --locked -p sigmacatch-input-ebpf --features ebpf

  # winevt + winevt-evtx share one target/ dir: the evtx build is incremental
  # (only walkdir joins the dep tree).
  windows:
    name: Windows (winevt, winevt+evtx)
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: windows-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy --locked --all-targets -- -W warnings
      - name: Build flavours
        shell: bash
        run: |
          cargo build --locked --target x86_64-pc-windows-msvc -p sigmacatch --all-targets
          cargo build --locked --target x86_64-pc-windows-msvc -p sigmacatch --features winevt,evtx

  # The macOS binary cannot be linked from Linux (no macOS SDK), so the ES
  # flavour is built natively on both macOS architectures.
  macos:
    name: macOS ${{ matrix.arch }} (Endpoint Security)
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: macos-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy --locked --all-targets --no-default-features --features macos -- -W warnings
      - name: Test (macOS Endpoint Security)
        run: cargo test --locked -p sigmacatch --no-default-features --features macos
      - name: Build (Endpoint Security, --all-targets)
        run: >
          cargo build --locked -p sigmacatch
          --no-default-features --features macos --all-targets

  # Anti-regression coverage gate: fails when line coverage of the
  # Linux-compilable input set drops below the threshold. `winevt` is a no-op
  # stub on Linux, so the gate runs on the rest of the stable feature matrix.
  # The instrumented build is a full workspace recompile: it runs only after
  # the matching test job and only when Rust source or the dependency tree
  # changed.
  coverage:
    name: Coverage gate
    needs: [linux, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: coverage-stable-${{ hashFiles('**/Cargo.lock') }}
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.2
      - name: Coverage gate (auditd+builtin+sysmon+evtx)
        run: |
          cargo llvm-cov --locked --workspace --all-targets \
            --no-default-features --features auditd,builtin,sysmon,evtx \
            --fail-under-lines 78

  # Companion gate for the `ebpf` input. This measures the host-side adapter
  # only: the nested `sensor/ebpf` kernel probe is a separate workspace built
  # for `bpfel-unknown-none`, and llvm-cov cannot instrument those objects.
  # The bar is 77, not the stable gate's 78, to absorb line-count drift
  # between nightly releases.
  coverage-ebpf:
    name: Coverage gate (ebpf)
    needs: [linux-ebpf, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ebpf
        with:
          rust-cache-key: coverage-ebpf-${{ hashFiles('**/Cargo.lock') }}
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.2
      - name: Coverage gate (auditd+builtin+ebpf)
        run: |
          cargo +nightly llvm-cov --locked --workspace --all-targets \
            --no-default-features --features auditd,builtin,ebpf \
            --fail-under-lines 77
