name: Create new release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux executable (all inputs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: nightly
      - run: rustup toolchain install nightly --component rust-src
      - name: Install bpf-linker (static musl release)
        # Re-download (pinned v0.11.0) instead of caching: this is a release
        # workflow, and actions/cache here trips zizmor's cache-poisoning audit.
        run: |
          curl -sL -o /tmp/bpf-linker.tar.zst \
            "https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          mkdir -p "${{ runner.tool_cache }}/bpf-linker"
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C "${{ runner.tool_cache }}/bpf-linker"
          echo "${{ runner.tool_cache }}/bpf-linker" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Release workflow publishes artifacts from cached build state; disable
        # cache restore/save to avoid cache-poisoning (zizmor cache-poisoning).
        with:
          lookup-only: true
      # One binary per input flavour (docs/build.md): the base auditd+builtin
      # build and the +sysmon / +ebpf variants must stay separate — ebpf needs
      # nightly + bpf-linker and changes the execution path, it must never be
      # merged with sysmon in a single artefact.
      - name: Build sigmacatch (auditd + builtin)
        run: >
          cargo build --release --locked -p sigmacatch --no-default-features
          --features auditd,builtin
      - name: Rename base flavour
        run: cp target/release/sigmacatch target/release/sigmacatch-linux
      - name: Build sigmacatch (auditd + builtin + sysmon)
        run: >
          cargo build --release --locked -p sigmacatch --no-default-features
          --features auditd,builtin,sysmon
      - name: Rename sysmon flavour
        run: cp target/release/sigmacatch target/release/sigmacatch-sysmon
      - name: Build sigmacatch (auditd + builtin + ebpf)
        run: >
          cargo build --release --locked -p sigmacatch --no-default-features
          --features auditd,builtin,ebpf
      - name: Rename ebpf flavour
        run: cp target/release/sigmacatch target/release/sigmacatch-ebpf
      - name: Build regressiondata-check (Linux)
        run: cargo build --release --locked -p sigmacatch --bin regressiondata-check
      - name: Package Linux distribution archive
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/sigmacatch-linux target/release/sigmacatch-sysmon \
             target/release/sigmacatch-ebpf target/release/regressiondata-check dist/
          (cd dist && sha256sum *) > SHA256SUMS.linux
          tar -czf sigmacatch-linux-x86_64.tar.gz -C dist .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigmacatch-linux-x86_64
          path: |
            sigmacatch-linux-x86_64.tar.gz
            SHA256SUMS.linux

  build-windows:
    name: Build Windows executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      # Two Windows flavours (docs/build.md): winevt (default feature) and the
      # +evtx one-shot writer — never a merged build.
      - name: Build sigmacatch (winevt)
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch
      - name: Rename winevt flavour
        shell: pwsh
        run: |
          Copy-Item target/x86_64-pc-windows-msvc/release/sigmacatch.exe `
            target/x86_64-pc-windows-msvc/release/sigmacatch-winevt.exe -Force
      - name: Build sigmacatch (winevt + evtx writer)
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch --features evtx
      - name: Rename evtx flavour
        shell: pwsh
        run: |
          Copy-Item target/x86_64-pc-windows-msvc/release/sigmacatch.exe `
            target/x86_64-pc-windows-msvc/release/sigmacatch-evtx.exe -Force
      - name: Build regressiondata-check (Windows)
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch --bin regressiondata-check
      - name: Package Windows distribution zip
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/sigmacatch-winevt.exe $dist
          Copy-Item target/x86_64-pc-windows-msvc/release/sigmacatch-evtx.exe $dist
          Copy-Item target/x86_64-pc-windows-msvc/release/regressiondata-check.exe $dist
          Get-FileHash -Algorithm SHA256 -Path "$dist/*" | ForEach-Object {
            "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf)
          } | Set-Content -Encoding ascii SHA256SUMS.windows
          Compress-Archive -Path "$dist/*" -DestinationPath sigmacatch-x86_64-pc-windows-msvc.zip -Force
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigmacatch-x86_64-pc-windows-msvc
          path: |
            sigmacatch-x86_64-pc-windows-msvc.zip
            SHA256SUMS.windows

  github:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    permissions:
      contents: write
      id-token: write # Sigstore keyless signing (cosign sign-blob)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate tag matches sigmacatch version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v${tag} does not match sigmacatch version ${version}"
            exit 1
          fi
      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: git-cliff
      - run: git-cliff --latest -o CHANGELOG.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sigmacatch-*
          path: artifacts
          merge-multiple: true
      # Keyless provenance via Sigstore on the distribution archives: each
      # `.bundle` (signature + certificate + Rekor timestamp) is published
      # next to its archive so users can verify with
      # `cosign verify-blob --bundle <archive>.bundle <archive>`.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release archives (Sigstore keyless)
        run: |
          set -euo pipefail
          for f in artifacts/*.tar.gz artifacts/*.zip; do
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file CHANGELOG.md artifacts/*
