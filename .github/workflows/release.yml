name: Create new release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux executables (3 flavours)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
      - run: rustup toolchain install nightly --component rust-src
      - name: Cache bpf-linker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/bpf-linker
          key: bpf-linker-0.11.0
      - name: Install bpf-linker (static musl release)
        run: |
          if [ ! -x "${{ runner.tool_cache }}/bpf-linker/bpf-linker" ]; then
            curl -sL -o /tmp/bpf-linker.tar.zst \
              "https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
            mkdir -p "${{ runner.tool_cache }}/bpf-linker"
            tar --zstd -xf /tmp/bpf-linker.tar.zst -C "${{ runner.tool_cache }}/bpf-linker"
          fi
          echo "${{ runner.tool_cache }}/bpf-linker" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Release workflow publishes artifacts from cached build state; disable
        # cache restore/save to avoid cache-poisoning (zizmor cache-poisoning).
        with:
          lookup-only: true
      # Explicit --bin per flavour: prevents a superset-feature build from
      # rebuilding earlier-named bins with the wider features (shared target).
      - name: Build base (auditd + builtin syslog)
        run: >
          cargo build --release --locked -p sigmacatch-lnx --bin sigmacatch-linux
          --no-default-features --features auditd,builtin
      - name: Build sysmon (adds legacy tail)
        run: >
          cargo build --release --locked -p sigmacatch-lnx --bin sigmacatch-linux-sysmon
          --no-default-features --features auditd,builtin,sysmon
      - name: Build ebpf (eBPF native probes)
        run: >
          cargo build --release --locked -p sigmacatch-lnx --bin sigmacatch-linux-ebpf
          --no-default-features --features auditd,builtin,ebpf
      - name: Build sigmacatch-check (Linux)
        run: cargo build --release --locked -p sigmacatch-check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigmacatch-linux-x86_64
          path: |
            target/release/sigmacatch-linux
            target/release/sigmacatch-linux-sysmon
            target/release/sigmacatch-linux-ebpf
            target/release/sigmacatch-check

  build-windows:
    name: Build Windows executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc -p sigmacatch-check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigmacatch-x86_64-pc-windows-msvc
          path: |
            target/x86_64-pc-windows-msvc/release/sigmacatch-channel.exe
            target/x86_64-pc-windows-msvc/release/sigmacatch-check.exe

  github:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate tag matches sigmacatch version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v${tag} does not match sigmacatch version ${version}"
            exit 1
          fi
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: git-cliff
      - run: git-cliff --latest -o CHANGELOG.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sigmacatch-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file CHANGELOG.md artifacts/*
