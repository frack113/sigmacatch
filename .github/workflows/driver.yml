name: Driver

on:
  push:
    paths:
      - 'sigmacatch/driver/**'
      - 'sigmacatch/src/windows/**'
      - '.github/workflows/driver.yml'
  pull_request:
    paths:
      - 'sigmacatch/driver/**'
      - 'sigmacatch/src/windows/**'
      - '.github/workflows/driver.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel driver
    runs-on: windows-latest
    env:
      RUSTFLAGS: >-
        -D warnings
        -C target-feature=+crt-static
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The WDK install/LLVM actions are maintained by the windows-drivers-rs
      # project; copy them in rather than re-implementing the installers.
      - name: Checkout windows-drivers-rs actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/windows-drivers-rs
          ref: main
          path: _temp/windows-drivers-rs
          persist-credentials: false
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Copy actions to workspace
        shell: pwsh
        run: Copy-Item -Recurse -Force _temp/windows-drivers-rs/.github/actions .github/

      - name: Install Winget
        uses: ./.github/actions/install-winget
        with:
          force-cli-install: 'false'

      - name: Install LLVM 17.0.6
        uses: ./.github/actions/install-llvm
        with:
          version: 17.0.6

      - name: Install WDK 10.0.22621
        uses: ./.github/actions/install-wdk
        with:
          version: 10.0.22621
          source: winget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: >
          cargo build
          --manifest-path sigmacatch/driver/Cargo.toml
          --release
          --target x86_64-pc-windows-msvc

      - name: Upload the driver image
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: sigmacatch-driver
          path: sigmacatch/driver/target/x86_64-pc-windows-msvc/release/sigmacatch_driver.dll
          if-no-files-found: error
          overwrite: true

      - name: Upload the wdk-sys bindings
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: wdk-bindings
          overwrite: true
          path: |
            sigmacatch/driver/target/x86_64-pc-windows-msvc/release/build/wdk-sys/*/out/types.rs
            sigmacatch/driver/target/x86_64-pc-windows-msvc/release/build/wdk-sys/*/out/ntddk.rs
            sigmacatch/driver/target/x86_64-pc-windows-msvc/release/build/wdk-sys/*/out/constants.rs
          if-no-files-found: error

      # Diagnostic: the wdk-sys bindings are generated from the WDK headers at
      # build time; dump the D2 types here so their exact names are visible.
      - name: Dump D2 bindings
        if: always()
        shell: pwsh
        run: |
          $types = Get-ChildItem -Recurse -Path sigmacatch/driver/target -Filter types.rs -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -match 'wdk-sys' } | Select-Object -First 1
          $ntddk = Get-ChildItem -Recurse -Path sigmacatch/driver/target -Filter ntddk.rs -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -match 'wdk-sys' } | Select-Object -First 1
          Write-Host "types=$($types.FullName) ntddk=$($ntddk.FullName)"
          foreach ($p in @('pub struct _OB_CALLBACK_REGISTRATION','pub struct _OB_OPERATION_REGISTRATION','pub struct _OB_PRE_OPERATION_INFORMATION','pub struct _OB_POST_OPERATION_INFORMATION','pub union _OB_PRE_OPERATION_PARAMETERS','pub struct _OB_PRE_CREATE_HANDLE_INFORMATION','pub union _OB_POST_OPERATION_PARAMETERS','pub struct _OB_POST_CREATE_HANDLE_INFORMATION','pub struct _OB_PRE_DUPLICATE_HANDLE_INFORMATION','pub struct _OB_POST_DUPLICATE_HANDLE_INFORMATION')) {
            Write-Host "=== $p ==="
            Select-String -Path $types.FullName -Pattern ([regex]::Escape($p)) -Context 0,22 | ForEach-Object { $_.Line; $_.Context.PostContext }
          }
          foreach ($p in @('pub fn ObRegisterCallbacks','pub fn ObUnRegisterCallbacks','pub fn PsGetProcessImageFileName','pub fn PsGetProcessId','pub fn PsGetCurrentProcessId','pub fn PsGetThreadProcessId')) {
            Write-Host "=== fn $p ==="
            Select-String -Path $ntddk.FullName -Pattern ([regex]::Escape($p)) -Context 0,6 | ForEach-Object { $_.Line; $_.Context.PostContext }
          }
          Write-Host "=== PsProcessType / PsThreadType ==="
          Select-String -Path $ntddk.FullName -Pattern 'PsProcessType|PsThreadType' | Select-Object -First 4 | ForEach-Object { $_.Line }

      - name: Upload the driver image
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: sigmacatch-driver
          path: sigmacatch/driver/target/x86_64-pc-windows-msvc/release/sigmacatch_driver.dll
          if-no-files-found: error
          overwrite: true

      - name: Upload the wdk-sys bindings
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: wdk-bindings
          overwrite: true
          path: |
            sigmacatch/driver/target/x86_64-pc-windows-msvc/release/build/wdk-sys/*/out/types.rs
            sigmacatch/driver/target/x86_64-pc-windows-msvc/release/build/wdk-sys/*/out/ntddk.rs
            sigmacatch/driver/target/x86_64-pc-windows-msvc/release/build/wdk-sys/*/out/constants.rs
          if-no-files-found: error

      # Diagnostic: the wdk-sys bindings are generated from the WDK headers at
      # build time, so their exact shape is only visible here.
      - name: Dump relevant bindings
        if: always()
        shell: pwsh
        run: |
          Write-Host "CARGO_TARGET_DIR=$env:CARGO_TARGET_DIR"
          Get-ChildItem -Recurse -Filter bindings.rs -Path . -ErrorAction SilentlyContinue | Select-Object -First 5 -ExpandProperty FullName
          $bindings = Get-ChildItem -Recurse -Filter bindings.rs -Path . -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bindings) { Write-Host "no bindings.rs found"; exit 0 }
          Write-Host "BINDINGS: $($bindings.FullName)"
          $patterns = @(
            'pub struct _WDF_IO_QUEUE_CONFIG',
            'pub struct _WDF_DRIVER_CONFIG',
            'pub const _WDF_IO_QUEUE_DISPATCH_TYPE',
            'pub const _WDF_DEVICE_IO_TYPE',
            'pub type WDFQUEUE',
            'pub type WDFDEVICE',
            'pub type WDFDRIVER',
            'pub type WDFREQUEST',
            'pub type WDFOBJECT',
            'pub struct _WDF_OBJECT_ATTRIBUTES'
          )
          foreach ($p in $patterns) {
            Write-Host "=== $p ==="
            Select-String -Path $bindings.FullName -Pattern $p -Context 0,24 | ForEach-Object { $_.Line; $_.Context.PostContext }
          }
          Write-Host "=== macro call_unsafe_wdf_function_binding ==="
          Select-String -Path $bindings.FullName -Pattern 'macro_rules! call_unsafe_wdf_function_binding' -Context 0,40 | ForEach-Object { $_.Line; $_.Context.PostContext }
