name: Test

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.package }}${{ matrix.features != '' && format(' — {0}', matrix.features) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: sigmacatch, features: '' }
          - { package: sigmacatch, features: 'auditd,builtin,sysmon' }
          - { package: sigmacatch, features: 'auditd,builtin,ebpf' }
          - { package: sigmacatch, features: 'evtx' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test package
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo test --locked -p ${{ matrix.package }} --no-default-features --features ${{ matrix.features }}
          else
            cargo test --locked -p ${{ matrix.package }}
          fi
