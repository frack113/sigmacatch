name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The stable feature matrix runs in one job so every invocation shares a
  # single target/ dir: the dependency tree (tokio, rsigma, …) is
  # compiled once, and only the feature-gated deps (regex, walkdir) plus the
  # sigmacatch crate are rebuilt per feature combination.
  test:
    name: Test (stable features)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-stable-${{ hashFiles('**/Cargo.lock') }}
      - name: Test (winevt)
        run: cargo test --locked -p sigmacatch
      # One invocation for every Linux-buildable crate except the eBPF probe
      # (nightly + bpf-linker): cargo resolves and compiles the shared
      # dependency tree once instead of once per step.
      - name: Test (workspace crates)
        run: >
          cargo test --locked
          -p sigmacatch-core
          -p sigmacatch-detection
          -p sigmacatch-runner
          -p sigmacatch-input-tail
          -p sigma-regression
          -p sigmacatch-repo
          -p sigmacatch-output-evtx
          -p sigmacatch-output-regression
          -p sigmacatch-input-etw-common
          -p sigmacatch-input-etw
          -p sigmacatch-input-etw-driver
          -p sigmacatch-input-auditd
          -p sigmacatch-input-syslog
          -p sigmacatch-input-sysmon
          -p sigmacatch-input-winevt
          -p sigmacatch-input-evtx
          -p sigmacatch-input-macos
      - name: Test (auditd+builtin+sysmon)
        run: cargo test --locked -p sigmacatch --no-default-features --features auditd,builtin,sysmon
      - name: Test (evtx)
        run: cargo test --locked -p sigmacatch --no-default-features --features evtx
      - name: Test (macOS event model, on Linux)
        run: cargo test --locked -p sigmacatch --no-default-features --features macos

  # ebpf needs nightly + rust-src + bpf-linker (build.rs) or the leg would
  # silently embed an empty placeholder object (false green). Separate job,
  # separate target dir from the stable leg.
  test-ebpf:
    name: Test (ebpf)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ebpf
        with:
          rust-cache-key: test-ebpf-${{ hashFiles('**/Cargo.lock') }}
      - name: Test (auditd+builtin+ebpf)
        run: cargo +nightly test --locked -p sigmacatch --no-default-features --features auditd,builtin,ebpf
      - name: Test eBPF host adapter
        run: cargo +nightly test --locked -p sigmacatch-input-ebpf --features ebpf

  # The ES client and eslogger modules are compiled only on macOS; the
  # platform-independent field mapping also runs in the Linux matrix above.
  macos:
    name: Test (macOS Endpoint Security)
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-macos-${{ hashFiles('**/Cargo.lock') }}
      - name: Test (macOS Endpoint Security)
        run: cargo test --locked -p sigmacatch --no-default-features --features macos

  # The coverage gates live in their own workflow (coverage.yml): the
  # instrumented build is a full workspace recompile, and it only needs to
  # run when Rust source or the dependency tree changes.
