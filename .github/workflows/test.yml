name: Test

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked -p sigmacatch-lnx
      - run: cargo test --locked -p sigmacatch-win
      - run: cargo test --locked -p sigmacatch-runner
      - run: cargo test --locked -p sigmacatch-regression
      - run: cargo test --locked -p sigmacatch-detection
      - run: cargo test --locked -p sigmacatch-config
      - run: cargo test --locked -p sigmacatch-rule
      - run: cargo test --locked -p sigmacatch-repo
      - run: cargo test --locked -p sigmacatch-types
      - run: cargo test --locked -p sigmacatch-logger
