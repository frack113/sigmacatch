[package]
name = "sigmacatch-win"
version.workspace = true
edition.workspace = true
description = "Windows sigmacatch binaries (Winevt + ETW collectors)"
license.workspace = true

[features]
default = ["winevt", "etw"]
winevt = ["dep:async-trait", "dep:windows"]
etw = [
    "dep:async-trait",
    "dep:windows",
    "dep:ferrisetw",
    "dep:hex",
    "dep:md5",
    "dep:sha1",
    "dep:sha2",
]
tools = ["dep:serde"]

[[bin]]
name = "sigmacatch-channel"
path = "src/main_winevt.rs"
required-features = ["winevt"]

[[bin]]
name = "sigmacatch-etw"
path = "src/main_etw.rs"
required-features = ["etw"]

[dependencies]
sigmacatch-runner = { path = "../crates/sigmacatch-runner" }
sigmacatch-config = { path = "../crates/sigmacatch-config" }
sigmacatch-detection = { path = "../crates/sigmacatch-detection" }
sigmacatch-regression = { path = "../crates/sigmacatch-regression" }
sigmacatch-rule = { path = "../crates/sigmacatch-rule" }
sigmacatch-repo = { path = "../crates/sigmacatch-repo" }
sigmacatch-types = { path = "../crates/sigmacatch-types" }

async-trait = { version = "0.1", optional = true }
hex = { version = "0.4", optional = true }
md5 = { version = "0.8", optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
anyhow = "1.0"
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }

serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_EventLog",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Wdk_System_Threading",
] }
ferrisetw = { version = "1.2.0", optional = true }

[dev-dependencies]
tempfile = "3.27"

# Quality contract (quality.md Q2.1): inherit workspace lint tiers.
[lints]
workspace = true
