[package]
name = "sigmacatch-win"
version.workspace = true
edition.workspace = true
description = "Windows sigmacatch binaries (Winevt collector)"
license.workspace = true

[features]
default = ["winevt"]
winevt = ["dep:async-trait", "dep:windows"]
evtx = [] # cross-platform EVTX file processor (no Windows deps)

[[bin]]
name = "sigmacatch-channel"
path = "src/main_winevt.rs"
required-features = ["winevt"]

[[bin]]
name = "sigmacatch-evtx"
path = "src/main_evtx.rs"
required-features = ["evtx"]

[dependencies]
sigmacatch-runner = { path = "../crates/sigmacatch-runner" }
sigmacatch-detection = { path = "../crates/sigmacatch-detection" }
sigmacatch-types = { path = "../crates/sigmacatch-types" }
input-windows-evtx = { path = "../crates/input-windows-evtx" }

async-trait = { version = "0.1", optional = true }
walkdir = "2"

tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "signal",
] }
tracing = "0.1"
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_EventLog",
] }

[dev-dependencies]
tempfile = "3"

# Quality contract: inherit workspace lint tiers ([workspace.lints] in root Cargo.toml).
[lints]
workspace = true
